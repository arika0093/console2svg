name: Docs / GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'docs-site/**'
      - 'src/ConsoleToSvg.Core/Svg/**'
      - '.github/workflows/docs-pages.yaml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CONSOLE2SVG_DOCS_SITE: https://console2svg.eclairs.cc
  CONSOLE2SVG_DOCS_BASE: ''
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  action-smoke-test:
    name: Test develop setup action
    if: github.ref == 'refs/heads/feat/add-document-site' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout shallow clone
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install console2svg from this checkout
        uses: ./
        with:
          version: develop

      - name: Verify executable
        run: console2svg --version

  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup GitHub Pages
        if: github.ref == 'refs/heads/main'
        id: pages
        uses: actions/configure-pages@v6

      - name: Set GitHub Pages base path
        if: github.ref == 'refs/heads/main'
        run: echo "CONSOLE2SVG_DOCS_BASE=${{ steps.pages.outputs.base_path }}" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install dependencies
        working-directory: docs-site
        run: npm ci

      - name: Prepare documentation assets
        working-directory: docs-site
        run: npm run prepare:assets

      - name: Setup console2svg and capture documentation images
        uses: ./
        with:
          version: develop

      - name: Generate documentation images
        env:
          CONSOLE2SVG_ASSETS_DIR: ${{ github.workspace }}/docs-site/public/assets
          CONSOLE2SVG_BATCH_LINK_BASE: /assets
        run: bash scripts/image-gen.sh

      - name: Build documentation
        working-directory: docs-site
        run: npm run build

      - name: Prefix root-relative links for project Pages
        working-directory: docs-site
        run: node scripts/prefix-base-paths.mjs dist "$CONSOLE2SVG_DOCS_BASE"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs-site/dist

  deploy:
    name: Deploy documentation
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
