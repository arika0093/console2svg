name: .NET Build and Release

on:
  workflow_dispatch:
  push:
    paths:
      - 'version.json'
    branches:
      - main

permissions:
  id-token: write
  contents: write

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  build-nupkg:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.semver }}
      package-version: ${{ steps.version.outputs.package_version }}
      package-iteration: ${{ steps.version.outputs.package_iteration }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: dotnet/nbgv@v0.5
        id: nbgv

      - name: Export version
        id: version
        shell: bash
        run: |
          semver='${{ steps.nbgv.outputs.SemVer2 }}'
          package_version="${semver%%[-+]*}"
          package_iteration=1

          if [[ "$semver" == *-* ]]; then
            prerelease="${semver#"$package_version"-}"
            prerelease="${prerelease%%+*}"
            prerelease="${prerelease//[^0-9A-Za-z.]/.}"
            prerelease="$(tr -s '.' <<< "$prerelease")"
            prerelease="${prerelease#.}"
            prerelease="${prerelease%.}"
            package_iteration="0.${prerelease}"
          fi

          if [[ "$semver" == *+* ]]; then
            metadata="${semver#*+}"
            metadata="${metadata//[^0-9A-Za-z.]/.}"
            metadata="$(tr -s '.' <<< "$metadata")"
            metadata="${metadata#.}"
            metadata="${metadata%.}"
            package_iteration="${package_iteration}.${metadata}"
          fi

          {
            echo "semver=$semver"
            echo "package_version=$package_version"
            echo "package_iteration=$package_iteration"
          } >> "$GITHUB_OUTPUT"

      - name: Restore dependencies
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Generate NuGet Package
        run: dotnet pack --no-build -c Release --output ./nuget-artifacts

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: ./nuget-artifacts/*.nupkg

  build-aot:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: windows-latest
            rid: win-x64
          - os: windows-latest
            rid: win-arm64
          - os: macos-latest
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish NativeAOT
        shell: bash
        run: |
          dotnet publish src/ConsoleToSvg/ConsoleToSvg.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained \
            -p:PublishAot=true \
            -p:PublishSingleFile=true \
            -p:WarningLevel=0 \
            -o ./native-publish/${{ matrix.rid }}

      - name: Upload native publish output
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.rid }}
          path: ./native-publish/${{ matrix.rid }}/**

  release-github:
    needs: [build-nupkg, build-aot]
    runs-on: ubuntu-latest

    steps:
      - name: Download NuGet artifacts
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: ./release-upload

      - name: Download all native publish artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: ./native-artifacts
          merge-multiple: false

      - name: Build native archives
        shell: bash
        run: |
          sudo apt-get install -y unzip tar

          for dir in ./native-artifacts/native-*/; do
            rid=$(basename "$dir" | sed 's/^native-//')
            bundle_dir="./bundle-${rid}"
            rm -rf "$bundle_dir"
            mkdir -p "$bundle_dir"

            if [[ "$rid" == win-* ]]; then
              cp "$dir/console2svg.exe" "$bundle_dir/console2svg.exe"
              # Copy native runtime libraries next to the executable (Windows loader).
              for f in "$dir"/*.dll; do
                [ -f "$f" ] && cp "$f" "$bundle_dir/"
              done
              # Copy child executables such as winpty-agent.exe.
              for f in "$dir"/*.exe; do
                [ -f "$f" ] || continue
                [ "$(basename "$f")" = "console2svg.exe" ] && continue
                cp "$f" "$bundle_dir/"
              done
            else
              cp "$dir/console2svg" "$bundle_dir/console2svg"
              chmod +x "$bundle_dir/console2svg"
              # Copy native runtime libraries next to the executable.
              for f in "$dir"/*.so "$dir"/*.dylib; do
                [ -f "$f" ] && cp "$f" "$bundle_dir/"
              done
            fi

            # Windows: bundle ffmpeg in a subdirectory so console2svg can locate it.
            case "$rid" in
              win-x64)
                ffmpeg_zip_url="https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl-shared.zip"
                ;;
              win-arm64)
                ffmpeg_zip_url="https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-winarm64-lgpl-shared.zip"
                ;;
              *)
                ffmpeg_zip_url=""
                ;;
            esac

            if [ -n "$ffmpeg_zip_url" ]; then
              ffmpeg_zip="./ffmpeg-${rid}.zip"
              curl -fsSL -o "$ffmpeg_zip" "$ffmpeg_zip_url"
              ffmpeg_extract="./ffmpeg-extract-${rid}"
              mkdir -p "$ffmpeg_extract"
              unzip -q "$ffmpeg_zip" -d "$ffmpeg_extract"
              top_dir=$(ls -d "$ffmpeg_extract"/*/ | head -1)
              ffmpeg_bin_dir="${top_dir}bin"
              if [ ! -f "$ffmpeg_bin_dir/ffmpeg.exe" ]; then
                echo "ffmpeg.exe not found at $ffmpeg_bin_dir/ffmpeg.exe."
                exit 1
              fi
              mkdir -p "$bundle_dir/ffmpeg"
              cp "$ffmpeg_bin_dir"/*.exe "$bundle_dir/ffmpeg/"
              cp "$ffmpeg_bin_dir"/*.dll "$bundle_dir/ffmpeg/"
              cp "${top_dir}LICENSE.txt" "$bundle_dir/ffmpeg/ffmpeg-LICENSE.txt"
            fi

            case "$rid" in
              win-*)
                archive_name="./release-upload/console2svg-${rid}.zip"
                (cd "$bundle_dir" && zip -q -r "../${archive_name#./}" .)
                ;;
              *)
                archive_name="./release-upload/console2svg-${rid}.tar.gz"
                tar -czf "$archive_name" -C "$bundle_dir" .
                ;;
            esac
            echo "Created $archive_name"
          done

      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
          sudo gem install --no-document fpm

      - name: Build Linux packages
        shell: bash
        run: |
          for rid in linux-x64 linux-arm64; do
            case "$rid" in
              linux-x64)
                asset_arch=x64
                deb_arch=amd64
                rpm_arch=x86_64
                ;;
              linux-arm64)
                asset_arch=arm64
                deb_arch=arm64
                rpm_arch=aarch64
                ;;
            esac

            src="./native-artifacts/native-${rid}/console2svg"
            if [ ! -f "$src" ]; then
              continue
            fi

            chmod 755 "$src"

            so_src="./native-artifacts/native-${rid}/libresvg_wrapper.so"
            if [ ! -f "$so_src" ]; then
              echo "Native library not found: $so_src"
              exit 1
            fi

            common_args=(
              -s dir
              -n console2svg
              -v "${{ needs.build-nupkg.outputs.package-version }}"
              --iteration "${{ needs.build-nupkg.outputs.package-iteration }}"
              --license Apache-2.0
              --url "https://github.com/${{ github.repository }}"
              --description "Convert terminal output to SVG images."
            )

            fpm "${common_args[@]}" -t deb -a "$deb_arch" -p "./release-upload/console2svg.${asset_arch}.deb" \
              "$src=/usr/local/bin/console2svg" \
              "$so_src=/usr/local/lib/console2svg/libresvg_wrapper.so"
            fpm "${common_args[@]}" -t rpm -a "$rpm_arch" -p "./release-upload/console2svg.${asset_arch}.rpm" \
              "$src=/usr/local/bin/console2svg" \
              "$so_src=/usr/local/lib/console2svg/libresvg_wrapper.so"
          done

      # Windows ffmpeg bundling is handled in "Build native archives" above.

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.build-nupkg.outputs.version }}
          name: ${{ needs.build-nupkg.outputs.version }}
          generate_release_notes: true
          files: ./release-upload/*

  release-nuget:
    needs: build-nupkg
    runs-on: ubuntu-latest

    steps:
      - name: Download NuGet artifacts
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: ./nuget-artifacts

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: arika0093

      - name: Publish NuGet Package
        run: dotnet nuget push ./nuget-artifacts/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ steps.login.outputs.NUGET_API_KEY }}

  release-npm:
    needs: [build-nupkg, release-github]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm
        run: npm install -g npm@latest

      - name: Set npm package version
        working-directory: wrapper/npm
        run: npm pkg set version="${{ needs.build-nupkg.outputs.version }}"

      - name: Publish npm package
        working-directory: wrapper/npm
        run: npm publish --provenance --access public

  image-gen:
    runs-on: ubuntu-latest
    needs: [release-github]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Setup console2svg
        uses: ./

      - name: Install dependencies
        run: |
          sudo npm install -g oh-my-logo
          sudo apt-get install -y sl nyancat vim cmatrix ffmpeg

      - name: Generate images
        run: bash scripts/image-gen.sh

      - name: Commit & Push
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "[skip-ci] chore: regenerate assets"
          branch: ${{ github.ref_name }}
