name: Dependabot auto-merge
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: write
  pull-requests: write

env:
  DOTNET_VERSION: '11.0.x'
  DOTNET_QUALITY: preview

jobs:
  package-test:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: ${{ env.DOTNET_QUALITY }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Run tests
        run: dotnet test --no-build --verbosity normal

  dependabot:
    runs-on: ubuntu-latest
    needs: package-test
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Merge Dependabot PR
        shell: bash
        run: |
          set -euo pipefail

          if output="$(gh pr merge --auto --squash "$PR_URL" 2>&1)"; then
            echo "$output"
            exit 0
          fi

          echo "$output"

          if grep -Fq "Protected branch rules not configured for this branch" <<<"$output"; then
            echo "GitHub auto-merge requires branch protection; merging now because package-test succeeded."
            gh pr merge --squash "$PR_URL"
          else
            exit 1
          fi
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
