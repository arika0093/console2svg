version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # This package is closely related to the .NET version on the user's side,
      # and if it is too high, the number of environments that do not work will increase.
      # Therefore, we want to keep it at the lowest possible version.
      - dependency-name: "Microsoft.CodeAnalysis.*"
    
  - package-ecosystem: "cargo"
    directory: "/src/ConsoleToSvg.Converter/native/resvg-wrapper"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/wrapper/npm"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/docs-site"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"