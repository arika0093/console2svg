name: Setup console2svg
description: Installs console2svg by downloading a release binary or building from source (develop), then adds it to PATH

inputs:
  version:
    description: 'Version to install (e.g. 0.4.3, latest, develop). Defaults to the latest release.'
    required: false
    default: 'latest'

runs:
  using: composite
  steps:
    - name: Setup .NET SDK (develop)
      if: ${{ inputs.version == 'develop' }}
      uses: actions/setup-dotnet@v6

    - name: Setup Rust (develop)
      if: ${{ inputs.version == 'develop' }}
      uses: dtolnay/rust-toolchain@stable

    - name: Build and install console2svg from source (develop)
      if: ${{ inputs.version == 'develop' }}
      shell: bash
      run: |
        case "${{ runner.os }}/${{ runner.arch }}" in
          Linux/X64)     RID="linux-x64"   ; EXT="" ;;
          Linux/ARM64)   RID="linux-arm64" ; EXT="" ;;
          Windows/X64)   RID="win-x64"     ; EXT=".exe" ;;
          Windows/ARM64) RID="win-arm64"   ; EXT=".exe" ;;
          macOS/X64)     RID="osx-x64"     ; EXT="" ;;
          macOS/ARM64)   RID="osx-arm64"   ; EXT="" ;;
          *)
            echo "Unsupported OS/arch: ${{ runner.os }}/${{ runner.arch }}"
            exit 1
            ;;
        esac

        case "$RID" in
          linux-x64) RUST_TARGET="x86_64-unknown-linux-gnu" ;;
          linux-arm64) RUST_TARGET="aarch64-unknown-linux-gnu" ;;
          win-x64) RUST_TARGET="x86_64-pc-windows-msvc" ;;
          win-arm64) RUST_TARGET="aarch64-pc-windows-msvc" ;;
          osx-x64) RUST_TARGET="x86_64-apple-darwin" ;;
          osx-arm64) RUST_TARGET="aarch64-apple-darwin" ;;
        esac
        rustup target add "$RUST_TARGET"

        INSTALL_DIR="${{ runner.tool_cache }}/console2svg/develop/${{ runner.arch }}"
        rm -rf "$INSTALL_DIR"
        mkdir -p "$INSTALL_DIR"
        publish_dir="$INSTALL_DIR/publish"

        export NBGV_GitEngine=Disabled
        dotnet publish "${{ github.action_path }}/src/ConsoleToSvg/ConsoleToSvg.csproj" \
          -c Release \
          -r "$RID" \
          -p:PublishAot=true \
          -p:SelfContained=true \
          -p:BuildResvgNative=false \
          -o "$publish_dir"
        "${{ github.action_path }}/scripts/build-resvg-native.sh" "$RUST_TARGET" "$publish_dir"

        if [ -f "$publish_dir/ConsoleToSvg${EXT}" ]; then
          cp "$publish_dir/ConsoleToSvg${EXT}" "$INSTALL_DIR/console2svg${EXT}"
        elif [ -f "$publish_dir/console2svg${EXT}" ]; then
          cp "$publish_dir/console2svg${EXT}" "$INSTALL_DIR/console2svg${EXT}"
        else
          echo "Published binary not found in $publish_dir"
          ls -la "$publish_dir"
          exit 1
        fi

        # Native runtime libraries and child executables must be next to the executable.
        if [ -n "${EXT}" ]; then
          for f in "$publish_dir"/*.dll; do
            [ -f "$f" ] && cp "$f" "$INSTALL_DIR/"
          done
          for f in "$publish_dir"/*.exe; do
            [ -f "$f" ] || continue
            [ "$(basename "$f")" = "console2svg${EXT}" ] && continue
            cp "$f" "$INSTALL_DIR/"
          done
        else
          for f in "$publish_dir"/*.so "$publish_dir"/*.dylib; do
            [ -f "$f" ] && cp "$f" "$INSTALL_DIR/"
          done
        fi

        [ -z "${EXT}" ] && chmod +x "$INSTALL_DIR/console2svg"
        rm -rf "$publish_dir"
        echo "$INSTALL_DIR" >> "$GITHUB_PATH"

    - name: Download and install console2svg
      if: ${{ inputs.version != 'develop' }}
      shell: bash
      run: |
        VERSION="${{ inputs.version }}"

        case "${{ runner.os }}/${{ runner.arch }}" in
          Linux/X64)     RID="linux-x64"   ; EXT="" ;;
          Linux/ARM64)   RID="linux-arm64" ; EXT="" ;;
          Windows/X64)   RID="win-x64"     ; EXT=".exe" ;;
          Windows/ARM64) RID="win-arm64"   ; EXT=".exe" ;;
          macOS/X64)     RID="osx-x64"     ; EXT="" ;;
          macOS/ARM64)   RID="osx-arm64"   ; EXT="" ;;
          *)
            echo "Unsupported OS/arch: ${{ runner.os }}/${{ runner.arch }}"
            exit 1
            ;;
        esac

        if [ -n "${EXT}" ]; then
          FILE="console2svg-${RID}.zip"
        else
          FILE="console2svg-${RID}.tar.gz"
        fi
        if [ "$VERSION" = "latest" ]; then
          URL="https://github.com/arika0093/console2svg/releases/latest/download/${FILE}"
        else
          URL="https://github.com/arika0093/console2svg/releases/download/v${VERSION}/${FILE}"
        fi

        INSTALL_DIR="${{ runner.tool_cache }}/console2svg/${VERSION}/${{ runner.arch }}"
        rm -rf "$INSTALL_DIR"
        mkdir -p "$INSTALL_DIR"
        archive_path="${INSTALL_DIR}/${FILE}"

        echo "Downloading ${URL} ..."
        curl -fsSL -L -o "$archive_path" "$URL"

        if [ -n "${EXT}" ]; then
          unzip -q "$archive_path" -d "$INSTALL_DIR"
        else
          tar -xzf "$archive_path" -C "$INSTALL_DIR"
        fi
        rm -f "$archive_path"

        [ -z "${EXT}" ] && chmod +x "${INSTALL_DIR}/console2svg"

        echo "$INSTALL_DIR" >> "$GITHUB_PATH"
