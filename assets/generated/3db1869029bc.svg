<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="484" viewBox="0 0 1024 484" role="img" aria-label="console2svg output">
<style>
.c2.c { font-family: "JetBrains Mono","Cascadia Mono","Segoe UI Mono","Noto Sans Mono","SFMono-Regular",Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace; font-size: 14px; }
.c2 text { white-space: pre; dominant-baseline: alphabetic; }
.c2 .q { shape-rendering: crispEdges; }
.c2 .aa{fill:#FFFF13;font-weight:bold}
.c2 .ab{fill:#d4d4d4}
.c2 .ac{fill:#11a8cd}
</style><defs><pattern id="c2-redacted-stripe" patternUnits="userSpaceOnUse" width="8" height="8"><path d="M0 0h8v8H0z" fill="#1e1e1e"/><path d="M-2,2 L2,-2 M0,8 L8,0 M6,10 L10,6" stroke="#d4d4d4" stroke-width="2" opacity="0.3"/></pattern></defs><defs>
<linearGradient id="c2bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1a1d2e"/><stop offset="100%" stop-color="#252840"/></linearGradient>
</defs>
<rect width="1024" height="484" fill="url(#c2bg)"/>
<rect width="1024" height="484" fill="#1e1e1e"/>
<g class="c2 c" transform="translate(8 8)">
<rect width="1008" height="468" fill="#1e1e1e"/>
</g>
<g class="c2 c" xml:space="preserve" transform="translate(8 8)">
<text class="aa" y="14" textLength="100.8">Description:</text>
<text class="ab" x="16.8" y="32" textLength="260.4">Convert terminal output to SVG.</text>
<text class="aa" y="68" textLength="50.4">Usage:</text>
<text class="ab" x="16.8" y="86" textLength="260.4">console2svg [command] [options]</text>
<text class="aa" y="122" textLength="67.2">Options:</text>
<text class="ac" x="16.8" y="140" textLength="50.4">--help</text>
<text class="ab" x="109.2" y="140" textLength="260.4">Show help and usage information</text>
<text class="ac" x="16.8" y="158" textLength="75.6">--version</text>
<text class="ab" x="109.2" y="158" textLength="201.6">Show version information</text>
<text class="aa" y="194" textLength="75.6">Commands:</text>
<text class="ab" x="16.8" y="212" textLength="369.6">capture      Capture terminal output as SVG.</text>
<text class="ab" x="16.8" y="230" textLength="445.2">interactive  Capture an interactive shell or program.</text>
<text class="ab" x="16.8" y="248" textLength="512.4">replay       Replay keyboard input while capturing a command.</text>
<text class="ab" x="16.8" y="266" textLength="319.2">cast         Render an asciicast file.</text>
<text class="ab" x="16.8" y="284" textLength="310.8">theme        Manage installed themes.</text>
<text class="ab" x="16.8" y="302" textLength="436.8">status       Show application and dependency status.</text>
<text class="ab" x="16.8" y="320" textLength="520.8">update       Check for or install a newer console2svg version.</text>
<text class="ab" x="16.8" y="338" textLength="310.8">llm          LLM integration helpers.</text>
<text class="ab" x="16.8" y="356" textLength="445.2">session      Manage LLM-controlled terminal sessions.</text>
<text class="ab" x="16.8" y="374" textLength="327.6">live-server  Serve a live terminal SVG.</text>
<text class="ab" x="16.8" y="392" textLength="352.8">tmux         Capture or serve a tmux pane.</text>
<text class="ab" x="16.8" y="410" textLength="361.2">batch        Run multiple captures in bulk.</text>
<text class="ab" x="16.8" y="428" textLength="714">completions  Commands for generating and registering completions for supported shells</text>
</g>
</svg>