name: Setup console2svg
description: Installs console2svg by downloading a release binary or building from source (develop), then adds it to PATH

inputs:
  version:
    description: 'Version to install (e.g. 0.4.3, latest, develop). Defaults to the latest release.'
    required: false
    default: 'latest'

runs:
  using: composite
  steps:
    - name: Setup .NET SDK (develop)
      if: ${{ inputs.version == 'develop' }}
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 11.0.x
        dotnet-quality: preview

    - name: Setup Rust (develop)
      if: ${{ inputs.version == 'develop' }}
      uses: dtolnay/rust-toolchain@stable

    - name: Fetch full Git history (develop)
      if: ${{ inputs.version == 'develop' }}
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        if git -C "$ACTION_PATH" rev-parse --is-inside-work-tree >/dev/null 2>&1 \
          && [ "$(git -C "$ACTION_PATH" rev-parse --is-shallow-repository)" = "true" ]; then
          git -C "$ACTION_PATH" fetch --unshallow --tags
        fi

    - name: Build and install console2svg from source (develop)
      if: ${{ inputs.version == 'develop' }}
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        TOOL_CACHE: ${{ runner.tool_cache }}
        RUNNER_OS: ${{ runner.os }}
        RUNNER_ARCH: ${{ runner.arch }}
      run: "${{ github.action_path }}/scripts/action-build-develop.sh"

    - name: Download and install console2svg
      if: ${{ inputs.version != 'develop' }}
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        TOOL_CACHE: ${{ runner.tool_cache }}
        RUNNER_OS: ${{ runner.os }}
        RUNNER_ARCH: ${{ runner.arch }}
      run: "${{ github.action_path }}/scripts/action-install-release.sh"
