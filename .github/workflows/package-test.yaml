name: Linux Package Test

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - release/*
    paths:
      - 'scripts/release/build-linux-packages.sh'
      - 'scripts/release/verify-linux-packages.sh'
      - 'scripts/release/install-linux-packaging-tools.sh'
      - '.github/workflows/package-test.yaml'
      - '.github/workflows/release.yaml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download stable Linux artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ./native-artifacts/native-linux-x64
          curl -fsSL \
            https://github.com/arika0093/console2svg/releases/latest/download/console2svg-linux-x64.tar.gz \
            -o /tmp/console2svg-linux-x64.tar.gz
          tar -xzf /tmp/console2svg-linux-x64.tar.gz \
            -C ./native-artifacts/native-linux-x64
          test -x ./native-artifacts/native-linux-x64/console2svg
          test -f ./native-artifacts/native-linux-x64/libconsole2svg_resvg.so

      - name: Install Linux packaging tools
        run: bash scripts/release/install-linux-packaging-tools.sh

      - name: Build Linux packages
        run: bash scripts/release/build-linux-packages.sh 0.0.0 1

      - name: Verify Linux package layout
        run: bash scripts/release/verify-linux-packages.sh
