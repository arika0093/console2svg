# yaml-language-server: $schema=https://raw.githubusercontent.com/arika0093/console2svg/main/schema/ConsoleToSvg.ConfigDocument.v1.json
$version: 1

# Shared options: these apply to compatible console2svg workflows.
options:
  # PTY dimensions in cells (distinct from appearance.size in pixels).
  terminal:
    width: 160 # -w
    height: 32 # -h

  # Capture behavior. Image and video-specific settings are selected by mode.
  capture:
    # image | video(-v)
    mode: video
    # --crop-*
    crop:
      top: 1ch
      bottom: "Hello!:-2"
      left: 1ch
      right: 10px
    video:
      fps: 12
      loop: true
      time:
        start: 0
        end: 10
      timing: deterministic # deterministic | realtime
      coalesce: auto # auto or a non-negative number of milliseconds
      fadeout: 0.5 # seconds
    # For image mode, specify at most one of frame and time.
    # image:
    #   frame: 3
    #   time: 2.5 # seconds

  # Rendering of recorded terminal contents.
  render:
    masking:
      auto: true
      strings:
        - password
        - secret
    adjust: spacing # spacing | spacingAndGlyphs

  # SVG conversion backend.
  converter:
    svg-converter: auto # auto | ffmpeg | rsvg | rsvg-convert | resvg

  # Rendered appearance. Arrays replace lower-priority arrays rather than append.
  appearance:
    font:
      family: "Fira Code, Fira Mono, monospace"
      size: 14
    # Pixel dimensions; usually set only one dimension.
    size:
      width: 800
      # height: 400
    theme:
      - nord
    window: macos-pc
    padding: 10
    margin: 8
    pc-padding: 12
    background:
      - "#000"
      - "#048"
    opacity: 0.85
    forecolor: "#fff"
    backcolor: "#000"
    header:
      # text: "my-override-command"
      with-command: true
      prompt: "$ "

  # Interactive terminal and live-server options.
  interactive:
    mouse: true   # --mouse
  live-server:
    host: ":8080" # Empty host means loopback; use "0.0.0.0:8080" to bind externally.

  # Policies for console2svg-managed environment variables.
  environment:
    color: overwrite   # overwrite | preserve. --no-colorenv
    ci: strip          # strip | preserve. --no-delete-envs
