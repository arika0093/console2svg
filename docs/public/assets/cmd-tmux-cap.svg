<svg xmlns="http://www.w3.org/2000/svg" width="688" height="232" viewBox="0 0 688 232" role="img" aria-label="console2svg output">
<style>
.c2.c { font-family: "JetBrains Mono","Cascadia Mono","Segoe UI Mono","Noto Sans Mono","SFMono-Regular",Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace; font-size: 14px; }
.c2 text { dominant-baseline: alphabetic; }
.c2 .q { shape-rendering: crispEdges; }
.c2 .w { white-space: pre; }
.c2 .aa{fill:#d4d4d4}
</style><rect width="688" height="232" fill="#1e1e1e"/>
<g class="c2 c" transform="translate(8 8)">
<rect width="672" height="216" fill="#1e1e1e"/>
<text class="aa w" y="14" textLength="117.6">$ echo &quot;hello&quot;</text>
<text class="aa" y="32" textLength="42">hello</text>
<text class="aa w" y="50" textLength="134.4">$ echo &quot;goodbye&quot;</text>
<text class="aa" y="68" textLength="58.8">goodbye</text>
<text class="aa" y="86" textLength="8.4">$</text>
</g>
</svg>