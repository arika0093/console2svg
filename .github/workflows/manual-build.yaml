name: Manual Build

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  build-aot:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            rust-target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            rust-target: aarch64-unknown-linux-gnu
          - os: windows-latest
            rid: win-x64
            rust-target: x86_64-pc-windows-msvc
          - os: windows-latest
            rid: win-arm64
            rust-target: aarch64-pc-windows-msvc
          - os: macos-latest
            rid: osx-x64
            rust-target: x86_64-apple-darwin
          - os: macos-latest
            rid: osx-arm64
            rust-target: aarch64-apple-darwin

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Build bundled resvg library
        shell: bash
        run: bash scripts/build-resvg-native.sh '${{ matrix.rust-target }}' './native-build/${{ matrix.rid }}'

      - name: Publish NativeAOT
        shell: bash
        run: bash scripts/release/publish-native-aot.sh '${{ matrix.rid }}'

      - name: Upload native publish output
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.rid }}
          path: |
            ./native-publish/${{ matrix.rid }}/**
            !./native-publish/${{ matrix.rid }}/**/*.dbg
            !./native-publish/${{ matrix.rid }}/**/*.pdb

  build-nupkg:
    needs: build-aot
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.nbgv.outputs.SemVer2 }}
      package-version: ${{ steps.nbgv.outputs.SimpleVersion }}
      package-iteration: ${{ steps.package-iteration.outputs.package_iteration }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: dotnet/nbgv@v0.5
        id: nbgv

      - name: Download native runtime assets
        uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: ./native-artifacts
          merge-multiple: false

      - name: Stage native runtime assets for NuGet
        shell: bash
        run: bash scripts/release/stage-native-assets.sh

      - name: Export package iteration
        id: package-iteration
        shell: bash
        run: bash scripts/release/export-package-iteration.sh '${{ steps.nbgv.outputs.PrereleaseVersionNoLeadingHyphen }}' '${{ steps.nbgv.outputs.BuildMetadataFragment }}'

      - name: Restore dependencies
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --no-restore -c Release -p:BuildResvgNative=false

      - name: Pack ConsoleToSvg.Converter
        run: dotnet pack src/ConsoleToSvg.Converter/ConsoleToSvg.Converter.csproj --no-build -c Release --output ./nuget-artifacts -p:ResvgNativeAssetsDirectory="$GITHUB_WORKSPACE/native-assets" -p:RequireResvgNativeAssets=true

      - name: Pack ConsoleToSvg tool
        run: dotnet pack wrapper/dotnet/ConsoleToSvg.Tool.csproj --no-build -c Release --output ./nuget-artifacts

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: ./nuget-artifacts/*.nupkg

  build-assets:
    needs: [build-nupkg, build-aot]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Download NuGet artifacts
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: ./release-upload

      - name: Download all native publish artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: ./native-artifacts
          merge-multiple: false

      # build-native-archives.sh bundles ffmpeg for Windows (win-x64, win-arm64)
      - name: Build native archives
        shell: bash
        run: bash scripts/release/build-native-archives.sh

      - name: Install Linux packaging tools
        run: bash scripts/release/install-linux-packaging-tools.sh

      - name: Build Linux packages
        shell: bash
        run: bash scripts/release/build-linux-packages.sh '${{ needs.build-nupkg.outputs.package-version }}' '${{ needs.build-nupkg.outputs.package-iteration }}'

      - name: Delete internal artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="${{ github.run_id }}"
          # Get artifact IDs to delete
          artifact_ids=$(gh api "repos/${{ github.repository }}/actions/runs/${run_id}/artifacts" \
            --jq '.artifacts[] | select(.name == "nuget-packages" or (.name | startswith("native-"))) | .id')
          for id in $artifact_ids; do
            gh api --method DELETE "repos/${{ github.repository }}/actions/artifacts/${id}" || true
          done

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: ./release-upload/*
