name: .NET Build and Release

on:
  workflow_dispatch:
  push:
    paths:
      - 'version.json'

permissions:
  id-token: write
  contents: write

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  build-nupkg:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.semver }}
      package-version: ${{ steps.version.outputs.package_version }}
      package-iteration: ${{ steps.version.outputs.package_iteration }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: dotnet/nbgv@v0.5
        id: nbgv

      - name: Export version
        id: version
        shell: bash
        run: |
          semver='${{ steps.nbgv.outputs.SemVer2 }}'
          package_version="${semver%%[-+]*}"
          package_iteration=1

          if [[ "$semver" == *-* ]]; then
            prerelease="${semver#"$package_version"-}"
            prerelease="${prerelease%%+*}"
            prerelease="${prerelease//[^0-9A-Za-z.]/.}"
            prerelease="$(tr -s '.' <<< "$prerelease")"
            prerelease="${prerelease#.}"
            prerelease="${prerelease%.}"
            package_iteration="0.${prerelease}"
          fi

          if [[ "$semver" == *+* ]]; then
            metadata="${semver#*+}"
            metadata="${metadata//[^0-9A-Za-z.]/.}"
            metadata="$(tr -s '.' <<< "$metadata")"
            metadata="${metadata#.}"
            metadata="${metadata%.}"
            package_iteration="${package_iteration}.${metadata}"
          fi

          {
            echo "semver=$semver"
            echo "package_version=$package_version"
            echo "package_iteration=$package_iteration"
          } >> "$GITHUB_OUTPUT"

      - name: Restore dependencies
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Generate NuGet Package
        run: dotnet pack --no-build -c Release --output ./nuget-artifacts

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: ./nuget-artifacts/*.nupkg

  build-aot:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: windows-latest
            rid: win-x64
          - os: windows-latest
            rid: win-arm64
          - os: macos-latest
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish NativeAOT
        shell: bash
        run: |
          dotnet publish src/ConsoleToSvg/ConsoleToSvg.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained \
            -p:PublishAot=true \
            -p:PublishSingleFile=true \
            -p:WarningLevel=0 \
            -o ./native-publish/${{ matrix.rid }}

      - name: Upload native binary
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.rid }}
          path: ./native-publish/${{ matrix.rid }}/console2svg*

  release-github:
    needs: [build-nupkg, build-aot]
    runs-on: ubuntu-latest

    steps:
      - name: Download NuGet artifacts
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: ./release-upload

      - name: Download all native binary artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: ./native-artifacts
          merge-multiple: false

      - name: Collect native binaries
        shell: bash
        run: |
          for dir in ./native-artifacts/native-*/; do
            rid=$(basename "$dir" | sed 's/^native-//')
            if [[ "$rid" == win-* ]]; then
              src="$dir/console2svg.exe"
              dst="./release-upload/console2svg-${rid}.exe"
            else
              src="$dir/console2svg"
              dst="./release-upload/console2svg-${rid}"
            fi
            if [ -f "$src" ]; then
              cp "$src" "$dst"
            fi
          done

      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
          sudo gem install --no-document fpm

      - name: Build Linux packages
        shell: bash
        run: |
          for rid in linux-x64 linux-arm64; do
            case "$rid" in
              linux-x64)
                asset_arch=x64
                deb_arch=amd64
                rpm_arch=x86_64
                ;;
              linux-arm64)
                asset_arch=arm64
                deb_arch=arm64
                rpm_arch=aarch64
                ;;
            esac

            src="./native-artifacts/native-${rid}/console2svg"
            if [ ! -f "$src" ]; then
              continue
            fi

            chmod 755 "$src"

            common_args=(
              -s dir
              -n console2svg
              -v "${{ needs.build-nupkg.outputs.package-version }}"
              --iteration "${{ needs.build-nupkg.outputs.package-iteration }}"
              --license Apache-2.0
              --url "https://github.com/${{ github.repository }}"
              --description "Convert terminal output to SVG images."
            )

            fpm "${common_args[@]}" -t deb -a "$deb_arch" -p "./release-upload/console2svg.${asset_arch}.deb" "$src=/usr/local/bin/console2svg"
            fpm "${common_args[@]}" -t rpm -a "$rpm_arch" -p "./release-upload/console2svg.${asset_arch}.rpm" "$src=/usr/local/bin/console2svg"
          done

      - name: Build Windows ffmpeg zip bundles
        shell: bash
        run: |
          sudo apt-get install -y unzip

          for rid in win-x64 win-arm64; do
            case "$rid" in
              win-x64)
                ffmpeg_zip_url="https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl-shared.zip"
                ;;
              win-arm64)
                ffmpeg_zip_url="https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-winarm64-lgpl-shared.zip"
                ;;
            esac

            src="./native-artifacts/native-${rid}/console2svg.exe"
            if [ ! -f "$src" ]; then
              continue
            fi

            # Download and extract the ffmpeg bundle
            ffmpeg_zip="./ffmpeg-${rid}.zip"
            curl -fsSL -o "$ffmpeg_zip" "$ffmpeg_zip_url"

            ffmpeg_dir="./ffmpeg-extract-${rid}"
            mkdir -p "$ffmpeg_dir"
            unzip -q "$ffmpeg_zip" -d "$ffmpeg_dir"

            # The BtbN zip contains a top-level directory with a bin/ subdirectory
            top_dir=$(ls -d "$ffmpeg_dir"/*/ | head -1)
            ffmpeg_bin_dir="${top_dir}bin"
            if [ ! -f "$ffmpeg_bin_dir/ffmpeg.exe" ]; then
              echo "ffmpeg.exe not found at $ffmpeg_bin_dir/ffmpeg.exe."
              exit 1
            fi

            # Build the bundle zip: console2svg.exe + ffmpeg binaries (exe + dlls) + LICENSE
            bundle_dir="./console2svg-${rid}-ffmpeg"
            mkdir -p "$bundle_dir"
            cp "$src" "$bundle_dir/console2svg.exe"
            cp "$ffmpeg_bin_dir"/*.exe "$bundle_dir/"
            cp "$ffmpeg_bin_dir"/*.dll "$bundle_dir/"
            cp "${top_dir}LICENSE.txt" "$bundle_dir/ffmpeg-LICENSE.txt"

            zip_name="./release-upload/console2svg-${rid}-ffmpeg.zip"
            zip -q -r "$zip_name" "$bundle_dir"
            echo "Created $zip_name"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.build-nupkg.outputs.version }}
          name: ${{ needs.build-nupkg.outputs.version }}
          generate_release_notes: true
          files: ./release-upload/*

  release-nuget:
    needs: build-nupkg
    runs-on: ubuntu-latest

    steps:
      - name: Download NuGet artifacts
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: ./nuget-artifacts

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: arika0093

      - name: Publish NuGet Package
        run: dotnet nuget push ./nuget-artifacts/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ steps.login.outputs.NUGET_API_KEY }}

  release-npm:
    needs: [build-nupkg, release-github]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm
        run: npm install -g npm@latest

      - name: Set npm package version
        working-directory: wrapper/npm
        run: npm pkg set version="${{ needs.build-nupkg.outputs.version }}"

      - name: Publish npm package
        working-directory: wrapper/npm
        run: npm publish --provenance --access public

  image-gen:
    runs-on: ubuntu-latest
    needs: [release-github]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Setup console2svg
        uses: ./

      - name: Install dependencies
        run: |
          sudo npm install -g oh-my-logo
          sudo apt-get install -y sl nyancat vim cmatrix ffmpeg

      - name: Generate images
        run: bash scripts/image-gen.sh

      - name: Commit & Push
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "[skip-ci] chore: regenerate assets"
          branch: ${{ github.ref_name }}
