<svg xmlns="http://www.w3.org/2000/svg" width="856" height="466" viewBox="0 0 856 466" role="img" aria-label="console2svg output">
<style>
.c2.c { font-family: "JetBrains Mono","Cascadia Mono","Segoe UI Mono","Noto Sans Mono","SFMono-Regular",Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace; font-size: 14px; }
.c2 text { dominant-baseline: alphabetic; }
.c2 .q { shape-rendering: crispEdges; }
.c2 .w { white-space: pre; }
.c2 .aa{fill:#d8dee9}
.c2 .ab{fill:#FFF4A7;font-weight:bold}
.c2 .ac{fill:#88c0d0}
.c2 .ad{fill:#b48ead}
</style><defs><pattern id="c2-redacted-stripe" patternUnits="userSpaceOnUse" width="8" height="8"><path d="M0 0h8v8H0z" fill="#101420"/><path d="M-2,2 L2,-2 M0,8 L8,0 M6,10 L10,6" stroke="#d8dee9" stroke-width="2" opacity="0.3"/></pattern></defs><defs>
<linearGradient id="c2bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#2e3440"/><stop offset="100%" stop-color="#3b4252"/></linearGradient>
</defs>
<rect width="856" height="466" fill="url(#c2bg)"/>
<rect width="856" height="466" fill="#101420"/>
<g class="c2 c"><rect x="8" y="8" width="840" height="18" fill="#101420"/>
<text class="aa" x="8" y="22"># console2svg</text></g>
<g class="c2 c" transform="translate(8 26)">
<rect width="840" height="432" fill="#101420"/>
</g>
<g class="c2 c" transform="translate(8 26)">
<text class="ab" y="14" textLength="100.8">Description:</text>
<text class="aa w" x="16.8" y="32" textLength="260.4">Convert terminal output to SVG.</text>
<text class="ab" y="68" textLength="50.4">Usage:</text>
<text class="aa w" x="16.8" y="86" textLength="260.4">console2svg [command] [options]</text>
<text class="ab" y="122" textLength="67.2">Options:</text>
<text class="ac" x="16.8" y="140" textLength="50.4">--help</text>
<text class="aa w" x="109.2" y="140" textLength="260.4">Show help and usage information</text>
<text class="ac" x="16.8" y="158" textLength="75.6">--version</text>
<text class="aa w" x="109.2" y="158" textLength="201.6">Show version information</text>
<text class="ab" y="194" textLength="75.6">Commands:</text>
<text class="aa" x="16.8" y="212" textLength="58.8">capture</text>
<text class="ad" x="84" y="212" textLength="75.6">&lt;command&gt;</text>
<text class="aa w" x="310.8" y="212" textLength="260.4">Capture terminal output as SVG.</text>
<text class="aa" x="16.8" y="230" textLength="92.4">interactive</text>
<text class="ad" x="117.6" y="230" textLength="75.6">&lt;command&gt;</text>
<text class="aa w" x="310.8" y="230" textLength="336">Capture an interactive shell or program.</text>
<text class="aa" x="16.8" y="248" textLength="50.4">replay</text>
<text class="ad" x="75.6" y="248" textLength="109.2">&lt;replay.json&gt;</text>
<text class="ad" x="193.2" y="248" textLength="75.6">&lt;command&gt;</text>
<text class="aa w" x="310.8" y="248" textLength="403.2">Replay keyboard input while capturing a command.</text>
<text class="aa" x="16.8" y="266" textLength="33.6">cast</text>
<text class="ad" x="58.8" y="266" textLength="50.4">&lt;cast&gt;</text>
<text class="aa w" x="310.8" y="266" textLength="210">Render an asciicast file.</text>
<text class="aa w" x="16.8" y="284" textLength="495.6">theme                              Manage installed themes.</text>
<text class="aa w" x="16.8" y="302" textLength="621.6">status                             Show application and dependency status.</text>
<text class="aa w" x="16.8" y="320" textLength="705.6">update                             Check for or install a newer console2svg version.</text>
<text class="aa" x="16.8" y="338" textLength="92.4">live-server</text>
<text class="ad" x="117.6" y="338" textLength="92.4">&lt;host:port&gt;</text>
<text class="ad" x="218.4" y="338" textLength="75.6">&lt;command&gt;</text>
<text class="aa w" x="310.8" y="338" textLength="218.4">Serve a live terminal SVG.</text>
<text class="aa w" x="16.8" y="356" textLength="537.6">tmux                               Capture or serve a tmux pane.</text>
<text class="aa w" x="16.8" y="374" textLength="546">batch                              Run multiple captures in bulk.</text>
<text class="aa w" x="16.8" y="392" textLength="756">completions                        Commands for generating and registering completions for</text>
<text class="aa w" x="310.8" y="410" textLength="134.4">supported shells</text>
</g>
</svg>