name: .NET Build and Release

on:
  workflow_dispatch:
  push:
    paths:
      - 'version.json'
    branches:
      - main

permissions:
  id-token: write
  contents: write

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  build-nupkg:
    needs: build-aot
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.nbgv.outputs.SemVer2 }}
      package-version: ${{ steps.nbgv.outputs.SimpleVersion }}
      package-iteration: ${{ steps.package-iteration.outputs.package_iteration }}
      prerelease: ${{ steps.nbgv.outputs.PrereleaseVersion != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: dotnet/nbgv@v0.5
        id: nbgv

      - name: Download native runtime assets
        uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: ./native-artifacts
          merge-multiple: false

      - name: Stage native runtime assets for NuGet
        shell: bash
        run: bash scripts/release/stage-native-assets.sh

      - name: Export package iteration
        id: package-iteration
        shell: bash
        run: bash scripts/release/export-package-iteration.sh '${{ steps.nbgv.outputs.PrereleaseVersionNoLeadingHyphen }}' '${{ steps.nbgv.outputs.BuildMetadataFragment }}'

      - name: Restore dependencies
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --no-restore -c Release -p:BuildResvgNative=false

      - name: Pack ConsoleToSvg.Converter
        run: dotnet pack src/ConsoleToSvg.Converter/ConsoleToSvg.Converter.csproj --no-build -c Release --output ./nuget-artifacts -p:ResvgNativeAssetsDirectory="$GITHUB_WORKSPACE/native-assets" -p:RequireResvgNativeAssets=true

      - name: Pack ConsoleToSvg tool
        run: dotnet pack wrapper/dotnet/ConsoleToSvg.Tool.csproj --no-build -c Release --output ./nuget-artifacts

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: ./nuget-artifacts/*.nupkg

  build-aot:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            rust-target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            rust-target: aarch64-unknown-linux-gnu
          - os: windows-latest
            rid: win-x64
            rust-target: x86_64-pc-windows-msvc
          - os: windows-latest
            rid: win-arm64
            rust-target: aarch64-pc-windows-msvc
          - os: macos-latest
            rid: osx-x64
            rust-target: x86_64-apple-darwin
          - os: macos-latest
            rid: osx-arm64
            rust-target: aarch64-apple-darwin

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Build bundled resvg library
        shell: bash
        run: bash scripts/build-resvg-native.sh '${{ matrix.rust-target }}' './native-build/${{ matrix.rid }}'

      - name: Publish NativeAOT
        shell: bash
        run: bash scripts/release/publish-native-aot.sh '${{ matrix.rid }}'

      - name: Upload native publish output
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.rid }}
          path: |
            ./native-publish/${{ matrix.rid }}/**
            !./native-publish/${{ matrix.rid }}/**/*.dbg
            !./native-publish/${{ matrix.rid }}/**/*.pdb

  release-github:
    needs: [build-nupkg, build-aot]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Download NuGet artifacts
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: ./release-upload

      - name: Download all native publish artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: ./native-artifacts
          merge-multiple: false

      - name: Build native archives
        shell: bash
        run: bash scripts/release/build-native-archives.sh

      - name: Install Linux packaging tools
        run: bash scripts/release/install-linux-packaging-tools.sh

      - name: Build Linux packages
        shell: bash
        run: bash scripts/release/build-linux-packages.sh '${{ needs.build-nupkg.outputs.package-version }}' '${{ needs.build-nupkg.outputs.package-iteration }}'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.build-nupkg.outputs.version }}
          name: ${{ needs.build-nupkg.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ needs.build-nupkg.outputs.prerelease == 'true' }}
          files: ./release-upload/*

  release-nuget:
    needs: [build-nupkg, release-github]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Download NuGet artifacts
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: ./nuget-artifacts

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: arika0093

      - name: Publish ConsoleToSvg.Converter Package
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push ./nuget-artifacts/ConsoleToSvg.Converter.*.nupkg --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY"

      - name: Publish ConsoleToSvg Tool Package
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push ./nuget-artifacts/ConsoleToSvg.[0-9]*.nupkg --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY"

  release-npm:
    needs: [build-nupkg, release-github]
    if: ${{ needs.build-nupkg.outputs.prerelease != 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm
        run: npm install -g npm@latest

      - name: Set npm package version
        working-directory: wrapper/npm
        run: npm pkg set version="${{ needs.build-nupkg.outputs.version }}"

      - name: Publish npm package
        working-directory: wrapper/npm
        run: npm publish --provenance --access public

  release-winget:
    needs: [build-nupkg, release-github]
    if: ${{ needs.build-nupkg.outputs.prerelease != 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Publish to WinGet
        # winget-releaser installs and invokes Komac to generate the manifests
        # and submit the update to microsoft/winget-pkgs.
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: arika0093.console2svg
          installers-regex: '^console2svg-win-(x64|arm64)\.zip$'
          release-tag: v${{ needs.build-nupkg.outputs.version }}
          token: ${{ secrets.WINGET_TOKEN }}

  image-gen:
    runs-on: ubuntu-latest
    needs: [release-github]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup console2svg
        uses: ./

      - name: Generate images
        run: bash scripts/image-gen.sh

      - name: Commit & Push
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "[skip-ci] chore: regenerate assets"
          branch: ${{ github.ref_name }}
